<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" role="img" aria-labelledby="t d">
  <title id="t">Kegel, Kugel und Zylinder mit demselben Radius</title>
  <desc id="d">Drei Körper nebeneinander, alle mit dem Radius r und der Höhe 2 mal r. Links ein Kegel mit der Spitze unten, in der Mitte eine Kugel, rechts ein Zylinder. Darunter stehen ihre Volumenanteile 1, 2 und 3.</desc>
  <g fill="none" stroke="#222" stroke-width="2">
    <polygon points="20,20 80,20 50,120" />
    <circle cx="150" cy="70" r="50" />
    <rect x="220" y="20" width="60" height="100" />
  </g>
  <text x="38" y="140" font-size="14" fill="#222" font-family="sans-serif">Kegel: 1</text>
  <text x="124" y="140" font-size="14" fill="#222" font-family="sans-serif">Kugel: 2</text>
  <text x="212" y="140" font-size="14" fill="#222" font-family="sans-serif">Zylinder: 3</text>
  <line x1="150" y1="70" x2="200" y2="70" stroke="#1a56c4" stroke-width="2" />
  <text x="170" y="64" font-size="13" fill="#1a56c4" font-family="sans-serif">r</text>
</svg>
