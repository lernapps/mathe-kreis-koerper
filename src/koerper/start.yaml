# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Das brauchst du für die Körper
description: "Was du für die Körper brauchst: Volumen und Oberfläche von Prismen, den Satz des Pythagoras und die Grundkörper Pyramide, Kegel und Kugel."
recap:
  [mathematik/volumen-oberflaeche-prisma, mathematik/satz-des-pythagoras, mathematik/grundkoerper-pyramide-kegel-kugel]
blocks:
  - type: section
    id: kopf
    title: Wofür diese Seite ist
    blocks:
      - type: text
        text: "Das brauchst du für die Körper in diesem Kapitel: Du kennst Prismen, rechnest mit dem Satz des Pythagoras und erkennst Pyramide, Kegel und Kugel. Zu jedem Thema gibt es die wichtigsten Wörter und ein Beispiel. Zwei Aufgaben auf der Seite zeigen dir, ob du bereit bist. Sie zählen nichts und werden nicht gespeichert."
  - type: section
    id: prisma
    title: "Volumen und Oberfläche: Prisma"
    blocks:
      - type: text
        text: "Der Baustein: Ich kann Volumen und Oberflächeninhalt von Prismen berechnen. Du brauchst es, weil du den Zylinder ähnlich rechnest wie ein Prisma."
      - type: definition
        term: Prisma
        explanation: "Ein Prisma hat zwei gleiche Vielecke als Grundfläche und Deckfläche. Sie liegen parallel, und die Seitenflächen sind Rechtecke. Ein Quader ist ein Prisma mit einem Rechteck als Grundfläche."
      - type: definition
        term: Volumen
        explanation: "Das Volumen sagt, wie viel in einen Körper passt. Beim Prisma ist es Grundfläche mal Höhe: $V = G \\cdot h$. Die Einheit ist zum Beispiel $\\text{cm}^3$."
      - type: definition
        term: Oberfläche
        explanation: "Die Oberfläche eines Körpers ist die Summe der Flächeninhalte aller Seiten, die ihn außen begrenzen. Die Einheit ist zum Beispiel $\\text{cm}^2$."
      - type: example
        title: Ein Quader
        blocks:
          - type: text
            text: "Ein Quader ist 4 cm lang, 3 cm breit und 2 cm hoch. Grundfläche 4 · 3 = 12 cm², Volumen 12 · 2 = 24 cm³. Oberfläche: 2 · (12 + 8 + 6) = 52 cm²."
      - type: single-choice
        id: quader-oberflaeche
        text: "Ein Quader ist 3 cm lang, 4 cm breit und 5 cm hoch. Wie groß ist seine Oberfläche?"
        options:
          - text: "94 cm²"
            correct: true
            info: "Drei Paare gleicher Rechtecke: 2 · (3 · 4 + 3 · 5 + 4 · 5) = 2 · 47 = 94."
          - text: "60 cm²"
            correct: false
            info: "Das ist die Zahl des Volumens (3 · 4 · 5). Gesucht ist die Fläche aller Seiten."
          - text: "47 cm²"
            correct: false
            info: "Du hast nur drei Rechtecke gezählt. Der Quader hat sechs Seiten, je zwei gleiche."
          - text: "12 cm²"
            correct: false
            info: "Das ist nur die Grundfläche 3 · 4. Dazu kommen Deckfläche und vier Seitenflächen."
        explanation: "Die Oberfläche ist die Summe aller sechs Rechtecke. Je zwei gegenüberliegende sind gleich."
      - type: text
        text: "Wenn dir das noch schwerfällt: Schau dir den Baustein „Volumen und Oberfläche: Prisma“ an. Seine Kartenseite: [Lernlandkarte](https://lernapps.net/apps/map/mathematik/c/volumen-oberflaeche-prisma/)."
  - type: section
    id: pythagoras
    title: Satz des Pythagoras
    blocks:
      - type: text
        text: "Der Baustein: Ich kann mit dem Satz des Pythagoras und seiner Umkehrung Streckenlängen berechnen und rechte Winkel prüfen. Du brauchst es, weil in Kegel und Pyramide rechtwinklige Dreiecke stecken."
      - type: definition
        term: Satz des Pythagoras
        explanation: "In einem rechtwinkligen Dreieck mit den Katheten $a$ und $b$ und der Hypotenuse $c$ gilt $a^2 + b^2 = c^2$. Damit berechnest du aus zwei Seiten die dritte."
      - type: example
        title: Die Hypotenuse
        blocks:
          - type: text
            text: "Katheten 3 cm und 4 cm: c² = 3² + 4² = 9 + 16 = 25, also c = 5 cm. Ist die Hypotenuse gegeben und eine Kathete gesucht, ziehst du ab: a² = c² − b²."
      - type: single-choice
        id: kathete-pythagoras
        text: "In einem rechtwinkligen Dreieck ist die Hypotenuse 13 cm lang und eine Kathete 5 cm. Wie lang ist die andere Kathete?"
        options:
          - text: "12 cm"
            correct: true
            info: "b² = c² − a² = 169 − 25 = 144, also b = 12."
          - text: "8 cm"
            correct: false
            info: "Du hast 13 − 5 gerechnet. Beim Satz des Pythagoras werden die Quadrate subtrahiert, nicht die Längen."
          - text: "18 cm"
            correct: false
            info: "Du hast die Längen addiert (13 + 5). Die Hypotenuse ist aber die längste Seite, die andere Kathete ist kürzer."
          - text: "13,9 cm"
            correct: false
            info: "Du hast die Quadrate addiert, wie bei der Hypotenuse. Hier ist die Hypotenuse gegeben, also subtrahierst du."
        explanation: "Ist die Hypotenuse gegeben, rechnest du b² = c² − a² und ziehst die Wurzel."
      - type: text
        text: "Wenn dir das noch schwerfällt: Schau dir den Baustein „Satz des Pythagoras“ an. Seine Kartenseite: [Lernlandkarte](https://lernapps.net/apps/map/mathematik/c/satz-des-pythagoras/)."
  - type: section
    id: grundkoerper
    title: Pyramide, Kegel und Kugel
    blocks:
      - type: text
        text: "Der Baustein: Ich kann Pyramide, Kegel und Kugel beschreiben und Körper aus dem Alltag in Grundkörper zerlegen. Du brauchst es, um Körper schon vor dem Rechnen zu erkennen und zu zerlegen."
      - type: definition
        term: Pyramide
        explanation: "Eine Pyramide hat ein Vieleck als Grundfläche. Ihre Seitenflächen sind Dreiecke, die in einer Spitze zusammenlaufen."
      - type: definition
        term: Kegel
        explanation: "Ein Kegel hat einen Kreis als Grundfläche. Er läuft in einer Spitze zusammen. Eine Eistüte ist ein Kegel."
      - type: definition
        term: Kugel
        explanation: "Eine Kugel ist rund und hat keine Kanten. Jeder Punkt ihrer Oberfläche hat denselben Abstand vom Mittelpunkt, den Radius."
      - type: example
        title: Ein Alltagskörper
        blocks:
          - type: text
            text: "Ein Bleistiftspitzer-Turm: Ein Quader, darauf eine Pyramide. Du zerlegst ihn in diese zwei Grundkörper und kannst jeden einzeln betrachten."
      - type: text
        text: "Wenn dir das noch schwerfällt: Schau dir den Baustein „Pyramide, Kegel und Kugel“ an. Seine Kartenseite: [Lernlandkarte](https://lernapps.net/apps/map/mathematik/c/grundkoerper-pyramide-kegel-kugel/)."
  - type: section
    id: bereit
    title: Du bist bereit, wenn du …
    blocks:
      - type: text
        text: |
          - Volumen und Oberfläche von Prismen und Quadern berechnen kannst,
          - mit dem Satz des Pythagoras eine fehlende Seite eines rechtwinkligen Dreiecks findest,
          - Pyramide, Kegel und Kugel erkennst und einen Alltagskörper in Grundkörper zerlegst.
