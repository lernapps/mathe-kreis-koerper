# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Kegel und Pyramide
description: "Ein Kegel fasst ein Drittel eines Zylinders mit gleicher Grundfläche und Höhe. Für den Mantel suchst du das rechtwinklige Dreieck, das im Körper steckt."
competencies: [volumen-oberflaeche-pyramide-kegel-kugel]
blocks:
  - type: section
    id: einstieg
    title: Kegel in den Zylinder schütten
    blocks:
      - type: text
        text: "Wenn du wissen willst, wie viel in einen Kegel oder eine Pyramide passt, vergleichst du sie mit einem Zylinder oder Prisma. Probiere es mit Wasser aus."
      - type: text
        text: "Ein Kegel und ein Zylinder haben dieselbe Grundfläche und dieselbe Höhe. Der Kegel ist mit Wasser gefüllt. Mit dem Knopf schüttest du ihn in den Zylinder. Der Zylinder ist unten noch leer. Der blaue Teil zeigt das Wasser."
      - type: vue-component
        id: umschuetten
        component: Umschuetten
        props:
          weiter: Kegel umschütten
          neu: Von vorn beginnen
          voll: "Der Zylinder ist voll: Der Kegel fasst genau ein Drittel."
          ergebnis: "Der Kegel wurde {k} mal umgeschüttet. Der Zylinder ist zu {k} von 3 Teilen gefüllt."
          bild: "Links ein Kegel mit der Spitze unten, rechts ein Zylinder. Der Kegel wurde {k} mal in den Zylinder umgeschüttet."
        nojs: |
          Ein Kegel und ein Zylinder haben dieselbe Grundfläche und dieselbe Höhe. Der Kegel ist voll Wasser. Du schüttest ihn in den Zylinder:

          - Nach 1 Mal ist der Zylinder zu einem Drittel gefüllt.
          - Nach 2 Mal ist er zu zwei Dritteln gefüllt.
          - Nach 3 Mal ist er ganz voll.

          Der Kegel fasst also ein Drittel des Zylinders.
      - type: number
        id: kegel-zylinder
        text: "Der Zylinder fasst 300 cm³. Wie viel Wasser fasst der Kegel mit derselben Grundfläche und derselben Höhe?"
        answer: 100
        tolerance: 0
        unit: cm³
        explanation: "Dreimal Umschütten füllt den Zylinder, also fasst der Kegel ein Drittel: 300 : 3 = 100 cm³."
  - type: section
    id: volumen
    title: Ein Drittel des Prismas
    blocks:
      - type: text
        text: "Wenn du das Volumen ausrechnen willst, ohne umzuschütten, nutzt du das Ergebnis des Versuchs als Formel."
      - type: text
        text: "Das Umschütten zeigt, wie das Volumen eines Kegels entsteht: ein Drittel des Zylinders mit derselben Grundfläche G und derselben Höhe h. Für die Pyramide gilt dasselbe, wenn du sie mit einem Prisma gleicher Grundfläche und Höhe vergleichst. Das nimmst du hier als gegeben."
      - type: formula
        formula: 'V_{\text{Kegel}} = \frac{1}{3} \cdot \pi \cdot r^2 \cdot h'
      - type: formula
        formula: 'V_{\text{Pyramide}} = \frac{1}{3} \cdot G \cdot h'
  - type: section
    id: dreieck
    title: Das versteckte Dreieck im Kegel
    blocks:
      - type: text
        text: "Wenn du die Oberfläche brauchst, zum Beispiel für das Papier einer Tüte, brauchst du die Länge der Mantellinie. Du findest sie in einem Dreieck, das im Körper steckt."
      - type: text
        text: "Für den Mantel brauchst du die **Mantellinie** s. Der Kegel ist gerade: Seine Spitze liegt senkrecht über dem Mittelpunkt des Grundkreises. Im Bild liegen Höhe h, Radius r und Mantellinie s in einem rechtwinkligen Dreieck. Der rechte Winkel liegt am Mittelpunkt des Grundkreises."
      - type: definition
        term: Mantellinie
        explanation: "Die Mantellinie eines Kegels ist die Strecke von der Spitze zu einem Punkt am Rand des Grundkreises. Sie ist länger als die Höhe und länger als der Radius."
      - type: figure
        image: images/kegel-dreieck.svg
        alt: "Ein Kegel. Die gestrichelte Höhe h, der Radius r in der Grundfläche und die Mantellinie s bilden ein blau markiertes rechtwinkliges Dreieck."
        caption: "Das blaue Dreieck hat die Katheten h und r und die Hypotenuse s."
        source: eigene Zeichnung
        licence: CC0-1.0
      - type: formula
        formula: "s^2 = r^2 + h^2"
      - type: text
        text: "Das ist der Satz des Pythagoras: Die Katheten sind r und h, die Hypotenuse ist s."
      - type: text
        text: "Rollst du den Mantel ab, entsteht ein Kreisausschnitt mit dem Radius s. Sein Bogen ist so lang wie der Umfang des Grundkreises, 2 · π · r. Für seine Fläche gilt dasselbe wie bei den Tortenstücken auf der Seite „Die Fläche des Kreises“: Die Fläche ist die Hälfte von Bogen mal Radius."
      - type: formula
        formula: 'M = \frac{1}{2} \cdot 2 \pi r \cdot s = \pi \cdot r \cdot s'
      - type: formula
        formula: 'O = \pi \cdot r^2 + \pi \cdot r \cdot s'
      - type: text
        text: "Bei der Pyramide steckt das Dreieck ebenso im Körper. Die Pyramide ist gerade und ihr Boden ein Quadrat mit der Kante a. Die Höhe h trifft die Mitte des Bodens. Von dort geht eine Strecke der Länge a : 2 zur Mitte einer Kante. Die **Seitenhöhe** $h_s$ geht von der Spitze zur Mitte dieser Kante, sie ist die Hypotenuse."
      - type: figure
        image: images/pyramide-dreieck.svg
        alt: "Eine Pyramide mit quadratischer Grundfläche. Die gestrichelte Höhe, die halbe Grundkante und die Seitenhöhe bilden ein blau markiertes rechtwinkliges Dreieck."
        caption: "Höhe, halbe Grundkante und Seitenhöhe: das blaue Dreieck hat einen rechten Winkel am Boden-Mittelpunkt."
        source: eigene Zeichnung
        licence: CC0-1.0
      - type: formula
        formula: 'h_s^2 = h^2 + \left( \frac{a}{2} \right)^2'
      - type: text
        text: "Der Mantel der Pyramide besteht aus vier gleichen Dreiecken mit der Grundseite a und der Höhe $h_s$."
      - type: formula
        formula: 'M = 4 \cdot \frac{1}{2} \cdot a \cdot h_s = 2 \cdot a \cdot h_s'
      - type: formula
        formula: 'O = a^2 + 2 \cdot a \cdot h_s'
  - type: section
    id: beispiel
    title: Ein Kegel mit r = 3 cm
    blocks:
      - type: text
        text: "Wenn du die Formeln an einem Kegel prüfen willst, rechne ihn mit r = 3 cm durch."
      - type: example
        title: "Radius 3 cm, Höhe 4 cm"
        blocks:
          - type: formula
            formula: 's = \sqrt{3^2 + 4^2} = \sqrt{25} = 5'
          - type: formula
            formula: 'V = \frac{1}{3} \cdot 3,14 \cdot 3^2 \cdot 4 = 37,68'
          - type: formula
            formula: 'M = 3,14 \cdot 3 \cdot 5 = 47,1'
          - type: formula
            formula: 'O = 3,14 \cdot 3^2 + 47,1 = 75,36'
          - type: text
            text: "Mantellinie 5 cm, Volumen 37,68 cm³, Oberfläche 75,36 cm². Die Mantellinie nimmst du für den Mantel, nicht die Höhe."
  - type: section
    id: uebung
    title: Aufgaben
    blocks:
      - type: generated
        id: kegel-volumen
        given:
          r: { int: [3, 9], step: 1 }
          h: { int: [3, 12], step: 1 }
        where: ["decimals(3.14 * r * r * h / 3) <= 2"]
        task:
          text: "Ein Kegel hat den Radius r = {{r}} cm und die Höhe h = {{h}} cm. Berechne sein Volumen mit π ≈ 3,14."
        answer: { value: "3.14 * r * r * h / 3", compare: { number: { decimals: 2, tolerance: 0, unit: cm³ } } }
        mistakes:
          - value: "3.14 * r * r * h"
            message: "Du hast den Zylinder gerechnet. Der Kegel fasst nur ein Drittel davon."
          - value: "3.14 * (2 * r) * (2 * r) * h / 3"
            message: "Du hast den Durchmesser statt des Radius quadriert. In π · r² steht der Radius."
          - value: "3.14 * r * h / 3"
            message: "Du hast r nicht quadriert. Die Grundfläche ist π · r²."
        hint: "Rechne erst das Volumen des Zylinders π · r² · h, dann ein Drittel davon."
        steps:
          - '$V = \frac{1}{3} \cdot \pi \cdot r^2 \cdot h \approx \frac{1}{3} \cdot 3,14 \cdot {{r}}^2 \cdot {{h}} = {{answer}}$'
      - type: generated
        id: mantellinie
        given:
          t: { pick: 1, from: { data: tripel } }
        task:
          text: "Ein Kegel hat den Radius r = {{t.radius}} cm und die Höhe h = {{t.hoehe}} cm. Wie lang ist die Mantellinie s?"
        answer: { value: "t.mantellinie", compare: { number: { decimals: 0, tolerance: 0, unit: cm } } }
        mistakes:
          - value: "t.radius + t.hoehe"
            message: "Du hast r und h addiert. Beim Satz des Pythagoras addierst du die Quadrate und ziehst die Wurzel."
          - value: "t.radius * t.radius + t.hoehe * t.hoehe"
            message: "Das ist s². Es fehlt die Wurzel."
        hint: "Höhe, Radius und Mantellinie bilden ein rechtwinkliges Dreieck. Die Mantellinie liegt gegenüber dem rechten Winkel."
        steps:
          - "$s^2 = r^2 + h^2 = {{t.radius}}^2 + {{t.hoehe}}^2$"
          - "Die Wurzel daraus ist {{answer}}."
      - type: generated
        id: kegel-oberflaeche
        given:
          t: { pick: 1, from: { data: tripel } }
        task:
          text: "Ein Kegel hat den Radius r = {{t.radius}} cm, die Höhe h = {{t.hoehe}} cm und die Mantellinie s = {{t.mantellinie}} cm. Berechne seine gesamte Oberfläche mit π ≈ 3,14."
        answer:
          {
            value: "3.14 * t.radius * t.radius + 3.14 * t.radius * t.mantellinie",
            compare: { number: { decimals: 2, tolerance: 0, unit: cm² } },
          }
        mistakes:
          - value: "3.14 * t.radius * t.mantellinie"
            message: "Du hast nur den Mantel gerechnet. Der Kreis am Boden fehlt."
          - value: "3.14 * t.radius * t.radius + 3.14 * t.radius * t.hoehe"
            message: "Du hast die Höhe statt der Mantellinie in den Mantel eingesetzt. Der Mantel ist π · r · s."
        hint: "Die Oberfläche ist die Grundfläche π · r² plus der Mantel π · r · s."
        steps:
          - '$O = \pi \cdot r^2 + \pi \cdot r \cdot s \approx 3,14 \cdot {{t.radius}}^2 + 3,14 \cdot {{t.radius}} \cdot {{t.mantellinie}} = {{answer}}$'
      - type: generated
        id: pyramide-volumen
        given:
          a: { int: [4, 12], step: 2 }
          h: { int: [3, 12], step: 1 }
        where: ["decimals(a * a * h / 3) <= 2"]
        task:
          text: "Eine Pyramide hat ein Quadrat mit der Kante a = {{a}} cm als Grundfläche und die Höhe h = {{h}} cm. Berechne ihr Volumen."
        answer: { value: "a * a * h / 3", compare: { number: { decimals: 2, tolerance: 0, unit: cm³ } } }
        mistakes:
          - value: "a * a * h"
            message: "Du hast das Volumen des Prismas gerechnet. Die Pyramide fasst nur ein Drittel davon."
          - value: "a * h / 3"
            message: "Die Grundfläche ist ein Quadrat: a · a, nicht nur a."
        hint: "Die Grundfläche ist a · a. Das Volumen ist ein Drittel von Grundfläche mal Höhe."
        steps:
          - '$V = \frac{1}{3} \cdot G \cdot h = \frac{1}{3} \cdot {{a}}^2 \cdot {{h}} = {{answer}}$'
      - type: generated
        id: pyramide-oberflaeche
        given:
          p: { pick: 1, from: { data: pyramiden } }
        task:
          text: "Eine gerade Pyramide hat ein Quadrat mit der Kante a = {{p.kante}} cm als Grundfläche und die Höhe h = {{p.hoehe}} cm. Berechne ihre Oberfläche. Die Seitenhöhe kommt als ganze Zahl heraus."
        answer:
          {
            value: "p.kante * p.kante + 2 * p.kante * p.seitenhoehe",
            compare: { number: { decimals: 0, tolerance: 0, unit: cm² } },
          }
        mistakes:
          - value: "2 * p.kante * p.seitenhoehe"
            message: "Du hast nur den Mantel gerechnet. Das Quadrat am Boden fehlt."
          - value: "p.kante * p.kante + 2 * p.kante * p.hoehe"
            message: "Du hast die Höhe statt der Seitenhöhe in den Mantel eingesetzt. Die Dreiecke des Mantels haben die Seitenhöhe als Höhe."
          - value: "p.kante * p.kante + 4 * p.kante * p.seitenhoehe"
            message: "Jedes Mantel-Dreieck hat die Fläche ein halb mal a mal Seitenhöhe. Du hast das Halbieren vergessen."
        hint: "Erst die Seitenhöhe: h² plus (a : 2)², dann die Wurzel. Dann O = a² + 2 · a · Seitenhöhe."
        steps:
          - '$h_s^2 = {{p.hoehe}}^2 + \left( \frac{{{p.kante}}}{2} \right)^2$'
          - "Die Seitenhöhe ist {{p.seitenhoehe}} cm. Dann ist die Oberfläche {{answer}} cm²."
      - type: number
        id: seitenhoehe
        text: "Eine Pyramide hat ein Quadrat mit der Kante a = 10 cm als Grundfläche und die Höhe h = 12 cm. Wie lang ist die Seitenhöhe?"
        answer: 13
        tolerance: 0
        unit: cm
        explanation: "Das Dreieck hat die Katheten h = 12 cm und a : 2 = 5 cm. Dann ist die Seitenhöhe zum Quadrat 12² + 5² = 169, also 13 cm."
      - type: single-choice
        id: kegel-drittel
        text: "Ein Kegel und ein Zylinder haben dieselbe Grundfläche und dieselbe Höhe. Der Zylinder hat das Volumen 90 cm³. Welches Volumen hat der Kegel?"
        options:
          - text: "30 cm³"
            correct: true
            info: "Der Kegel fasst ein Drittel des Zylinders: 90 : 3 = 30."
          - text: "45 cm³"
            correct: false
            info: "Das wäre die Hälfte. Beim Umschütten brauchst du aber drei Kegel, nicht zwei."
          - text: "270 cm³"
            correct: false
            info: "Du hast mit 3 multipliziert. Der Kegel ist der kleinere Körper und fasst weniger."
        explanation: "Drei Kegelfüllungen ergeben einen Zylinder, also ist der Kegel ein Drittel des Zylinders."
      - type: text
        text: "**Das kannst du jetzt:** Du kannst Volumen und Oberfläche von Kegel und Pyramide berechnen und das rechtwinklige Dreieck für Mantellinie und Seitenhöhe im Körper finden."
